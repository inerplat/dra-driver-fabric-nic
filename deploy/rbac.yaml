apiVersion: v1
kind: Namespace
metadata:
  name: fabric-nic
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabric-nic-plugin
  namespace: fabric-nic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fabric-nic-plugin
rules:
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceslices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fabric-nic-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fabric-nic-plugin
subjects:
- kind: ServiceAccount
  name: fabric-nic-plugin
  namespace: fabric-nic
