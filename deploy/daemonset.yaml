apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-nic-plugin
  namespace: fabric-nic
spec:
  selector:
    matchLabels:
      app: fabric-nic-plugin
  template:
    metadata:
      labels:
        app: fabric-nic-plugin
    spec:
      serviceAccountName: fabric-nic-plugin
      priorityClassName: system-node-critical
      # Select the nodes that hand NICs to VMs.
      nodeSelector:
        fabric-nic.inerplat.github.io/enabled: "true"
      tolerations:
      - operator: Exists
      # fabric-nic-prep runs once per pod start: it decides the role of every
      # Mellanox PF from the node's mode label and port annotations, binds the
      # vfio-pci ones, and writes the attribute files the plugin reads. Only
      # this container is privileged; it enters the host's network and PID
      # namespaces itself, so the pod does not share them.
      initContainers:
      - name: prep
        image: fabric-nic-prep:dev
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Mode of a node without the fabric-nic.inerplat.github.io/mode
        # label: auto, report or off.
        - name: DEFAULT_MODE
          value: report
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
        - name: attributes
          mountPath: /var/lib/fabric-nic
      containers:
      - name: plugin
        image: fabric-nic-plugin:dev
        args:
        - --attributes-file=/var/lib/fabric-nic/attributes.json,/var/lib/fabric-nic/attributes.generated.json
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: plugins
          mountPath: /var/lib/kubelet/plugins
        - name: cdi
          mountPath: /var/run/cdi
        - name: attributes
          mountPath: /var/lib/fabric-nic
          readOnly: true
      volumes:
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
      - name: plugins
        hostPath:
          path: /var/lib/kubelet/plugins
      - name: cdi
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      - name: attributes
        hostPath:
          path: /var/lib/fabric-nic
          type: DirectoryOrCreate
      - name: host-proc
        hostPath:
          path: /proc
      - name: host-sys
        hostPath:
          path: /sys
