apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-nic-plugin
  namespace: fabric-nic
spec:
  selector:
    matchLabels:
      app: fabric-nic-plugin
  template:
    metadata:
      labels:
        app: fabric-nic-plugin
    spec:
      serviceAccountName: fabric-nic-plugin
      priorityClassName: system-node-critical
      # Select the nodes that hand NICs to VMs.
      nodeSelector:
        fabric-nic.inerplat.github.io/enabled: "true"
      tolerations:
      - operator: Exists
      containers:
      - name: plugin
        image: fabric-nic-plugin:dev
        args:
        - --attributes-file=/var/lib/fabric-nic/attributes.json
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: plugins
          mountPath: /var/lib/kubelet/plugins
        - name: cdi
          mountPath: /var/run/cdi
        - name: attributes
          mountPath: /var/lib/fabric-nic
          readOnly: true
      volumes:
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
      - name: plugins
        hostPath:
          path: /var/lib/kubelet/plugins
      - name: cdi
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      - name: attributes
        hostPath:
          path: /var/lib/fabric-nic
          type: DirectoryOrCreate
